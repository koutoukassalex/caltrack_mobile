name: caltrack_mobile
description: "CaLtrack-AI — AI-Powered Calorie & Macro Tracker for iOS and Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  intl: ^0.19.0
  image_picker: ^1.1.0
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
